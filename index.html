<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Portfolio | shioki</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --color-primitive-blue-800: #0031d8;
            --color-primitive-light-blue-50: #f0f9ff;
            --color-primitive-light-blue-200: #c0e4ff;
            --color-neutral-white: #ffffff;
            --color-neutral-solid-gray-50: #f2f2f2;
            --color-neutral-solid-gray-100: #e6e6e6;
            --color-neutral-solid-gray-536: #767676;
            --color-neutral-solid-gray-600: #666666;
            --color-neutral-solid-gray-900: #1a1a1a;
            --font-family-sans: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-size-14: 0.875rem;
            --font-size-16: 1rem;
            --font-size-28: 1.75rem;
            --font-weight-400: 400;
            --font-weight-700: 700;
            --line-height-170: 1.7;
            --border-radius-8: 0.5rem;
            --border-radius-full: 624.9375rem;
            --elevation-1: 0 2px 8px 1px rgba(0,0,0,0.1), 0 1px 5px 0 rgba(0,0,0,0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family-sans);
            background: var(--color-neutral-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--color-neutral-solid-gray-900);
            line-height: var(--line-height-170);
            font-size: var(--font-size-16);
            font-weight: var(--font-weight-400);
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-neutral-solid-gray-100);
        }

        .header h1 {
            font-size: var(--font-size-28);
            font-weight: var(--font-weight-700);
            margin-bottom: 0.3rem;
            color: var(--color-neutral-solid-gray-900);
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
        }

        .review-card {
            padding: 1rem;
            border-bottom: 1px solid var(--color-neutral-solid-gray-100);
            text-decoration: none;
            color: inherit;
            display: block;
            border-radius: var(--border-radius-8);
            transition: background 0.15s, box-shadow 0.2s;
        }

        .review-card:first-child {
            border-top: 1px solid var(--color-neutral-solid-gray-100);
        }

        .review-card:hover {
            background: var(--color-neutral-solid-gray-50);
            box-shadow: var(--elevation-1);
        }

        .review-card .review-title {
            font-size: 1.05rem;
            font-weight: var(--font-weight-700);
            color: var(--color-primitive-blue-800);
            margin-bottom: 0.2rem;
        }

        .review-card:hover .review-title {
            text-decoration: underline;
        }

        .review-card .review-author {
            font-size: var(--font-size-14);
            color: var(--color-neutral-solid-gray-600);
            margin-bottom: 0.4rem;
        }

        .review-card .review-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .lang-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: var(--border-radius-full);
            background: var(--color-primitive-light-blue-50);
            color: var(--color-primitive-blue-800);
            border: 1px solid var(--color-primitive-light-blue-200);
            text-decoration: none;
            transition: background 0.15s;
        }

        .lang-badge:hover {
            background: var(--color-primitive-light-blue-200);
        }

        .review-date {
            font-size: 0.75rem;
            color: var(--color-neutral-solid-gray-536);
            margin-left: auto;
        }

        .empty-state {
            text-align: center;
            color: var(--color-neutral-solid-gray-536);
            padding: 3rem 1rem;
        }

        footer {
            margin-top: auto;
            padding: 2rem 1rem;
            color: var(--color-neutral-solid-gray-536);
            font-size: 0.8rem;
            text-align: center;
        }

        footer a {
            color: var(--color-primitive-blue-800);
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        .nav-link {
            display: inline-block;
            color: var(--color-primitive-blue-800);
            text-decoration: none;
            font-size: var(--font-size-14);
            padding: 0.75rem 1.5rem;
        }

        .nav-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.4rem; }
            .container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <a href="/okiwa-profile.html" class="nav-link">キャラクター紹介</a>
<div class="container">
        <div class="header">
            <h1>Books Portfolio</h1>
        </div>

        <div id="reviews-list" class="reviews-list">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> <a href="https://github.com/shioki" target="_blank">shioki</a> &middot; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license">CC BY-NC-SA 4.0</a></p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        var LANG_LABELS = { ja: '日本語', en: 'English', 'zh-tw': '繁體中文' };

        fetch('reviews.json')
            .then(function (res) { return res.json(); })
            .then(function (reviews) {
                var list = document.getElementById('reviews-list');

                if (reviews.length === 0) {
                    list.innerHTML = '<div class="empty-state">No reviews yet.</div>';
                    return;
                }

                reviews.sort(function (a, b) {
                    var ka = a.created_at || a.date || '';
                    var kb = b.created_at || b.date || '';
                    return kb.localeCompare(ka);
                });

                list.innerHTML = '';
                reviews.forEach(function (r) {
                    var card = document.createElement('a');
                    card.className = 'review-card';
                    card.href = 'reviews/ja/' + encodeURIComponent(r.filename.replace('.md', '.html'));

                    var title = document.createElement('div');
                    title.className = 'review-title';
                    title.textContent = r.title;

                    var author = document.createElement('div');
                    author.className = 'review-author';
                    author.textContent = r.author;

                    var meta = document.createElement('div');
                    meta.className = 'review-meta';

                    (r.languages || ['ja']).forEach(function (lang) {
                        var badge = document.createElement('a');
                        badge.className = 'lang-badge';
                        badge.textContent = LANG_LABELS[lang] || lang;
                        badge.href = 'reviews/' + lang + '/' + encodeURIComponent(r.filename.replace('.md', '.html'));
                        badge.addEventListener('click', function (e) { e.stopPropagation(); });
                        meta.appendChild(badge);
                    });

                    if (r.date) {
                        var date = document.createElement('span');
                        date.className = 'review-date';
                        date.textContent = r.date;
                        meta.appendChild(date);
                    }

                    card.appendChild(title);
                    card.appendChild(author);
                    card.appendChild(meta);
                    list.appendChild(card);
                });
            })
            .catch(function () {
                var list = document.getElementById('reviews-list');
                list.innerHTML = '<div class="empty-state">No reviews yet.</div>';
            });
    </script>
</body>
</html>
