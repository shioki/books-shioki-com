<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Portfolio | shioki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #e8e8e8;
        }

        .container {
            text-align: center;
            padding: 2rem;
            max-width: 960px;
            width: 100%;
        }

        .logo {
            font-size: 4rem;
            margin-bottom: 0.5rem;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #e94560, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .tagline {
            font-size: 1.1rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }

        /* Reviews Section */
        .reviews-section {
            text-align: left;
            margin-top: 1rem;
        }

        .reviews-section h2 {
            font-size: 1.3rem;
            color: #a0a0a0;
            margin-bottom: 1rem;
            text-align: center;
        }

        .reviews-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .review-card {
            background: rgba(255, 255, 255, 0.07);
            border-radius: 12px;
            padding: 1.2rem 1.5rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: background 0.2s, border-color 0.2s;
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .review-card:hover {
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(233, 69, 96, 0.4);
        }

        .review-card .review-title {
            font-size: 1.1rem;
            font-weight: bold;
            color: #e8e8e8;
            margin-bottom: 0.3rem;
        }

        .review-card .review-author {
            font-size: 0.9rem;
            color: #a0a0a0;
            margin-bottom: 0.5rem;
        }

        .review-card .review-meta {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .lang-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: 4px;
            background: rgba(233, 69, 96, 0.25);
            color: #e94560;
            border: 1px solid rgba(233, 69, 96, 0.35);
            text-decoration: none;
            transition: background 0.15s;
        }

        .lang-badge:hover {
            background: rgba(233, 69, 96, 0.45);
        }

        .review-date {
            font-size: 0.75rem;
            color: #606060;
            margin-left: auto;
        }

        .empty-state {
            text-align: center;
            color: #606060;
            padding: 2rem;
        }

        footer {
            margin-top: 3rem;
            padding-bottom: 2rem;
            color: #606060;
            font-size: 0.9rem;
        }

        footer a {
            color: #e94560;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .logo { font-size: 3rem; }
            .review-card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>Books Portfolio</h1>
        <p class="tagline">Kindle × AI による書評・4コマ漫画</p>

        <div class="reviews-section">
            <div id="reviews-list" class="reviews-list">
                <div class="empty-state">読み込み中...</div>
            </div>
        </div>

    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> <a href="https://github.com/shioki" target="_blank">shioki</a></p>
        <p><a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license">CC BY-NC-SA 4.0</a></p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        const LANG_LABELS = { ja: '日本語', en: 'English', 'zh-tw': '繁體中文' };

        fetch('reviews.json')
            .then(function (res) { return res.json(); })
            .then(function (reviews) {
                var list = document.getElementById('reviews-list');

                if (reviews.length === 0) {
                    list.innerHTML = '<div class="empty-state">書評はまだありません。</div>';
                    return;
                }

                list.innerHTML = '';
                reviews.forEach(function (r) {
                    var card = document.createElement('a');
                    card.className = 'review-card';
                    card.href = 'reviews/ja/' + encodeURIComponent(r.filename);

                    var title = document.createElement('div');
                    title.className = 'review-title';
                    title.textContent = r.title;

                    var author = document.createElement('div');
                    author.className = 'review-author';
                    author.textContent = r.author;

                    var meta = document.createElement('div');
                    meta.className = 'review-meta';

                    (r.languages || ['ja']).forEach(function (lang) {
                        var badge = document.createElement('a');
                        badge.className = 'lang-badge';
                        badge.textContent = LANG_LABELS[lang] || lang;
                        badge.href = 'reviews/' + lang + '/' + encodeURIComponent(r.filename);
                        badge.addEventListener('click', function (e) { e.stopPropagation(); });
                        meta.appendChild(badge);
                    });

                    if (r.date) {
                        var date = document.createElement('span');
                        date.className = 'review-date';
                        date.textContent = r.date;
                        meta.appendChild(date);
                    }

                    card.appendChild(title);
                    card.appendChild(author);
                    card.appendChild(meta);
                    list.appendChild(card);
                });
            })
            .catch(function () {
                var list = document.getElementById('reviews-list');
                list.innerHTML = '<div class="empty-state">書評はまだありません。</div>';
            });
    </script>
</body>
</html>
