    <style>
        :root {
            --color-primitive-blue-800: #0031d8;
            --color-primitive-blue-900: #0017c1;
            --color-primitive-light-blue-50: #f0f9ff;
            --color-primitive-light-blue-200: #c0e4ff;
            --color-neutral-white: #ffffff;
            --color-neutral-solid-gray-50: #f2f2f2;
            --color-neutral-solid-gray-100: #e6e6e6;
            --color-neutral-solid-gray-536: #767676;
            --color-neutral-solid-gray-600: #666666;
            --color-neutral-solid-gray-900: #1a1a1a;
            --font-family-sans: 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-size-14: 0.875rem;
            --font-size-16: 1rem;
            --font-size-20: 1.25rem;
            --font-size-24: 1.5rem;
            --font-size-28: 1.75rem;
            --font-weight-400: 400;
            --font-weight-700: 700;
            --line-height-170: 1.7;
            --border-radius-8: 0.5rem;
            --border-radius-12: 0.75rem;
            --border-radius-full: 624.9375rem;
            --elevation-1: 0 2px 8px 1px rgba(0,0,0,0.1), 0 1px 5px 0 rgba(0,0,0,0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font-family-sans);
            background: var(--color-neutral-white);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--color-neutral-solid-gray-900);
            line-height: var(--line-height-170);
            font-size: var(--font-size-16);
            font-weight: var(--font-weight-400);
            overflow-x: hidden;
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 800px;
            width: 100%;
            min-width: 0;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--color-neutral-solid-gray-100);
        }

        .header h1 {
            font-size: var(--font-size-28);
            font-weight: var(--font-weight-700);
            margin-bottom: 0.3rem;
            color: var(--color-neutral-solid-gray-900);
        }

        /* ── Recent Updates ── */
        .recent-updates {
            margin-bottom: 2rem;
            background: var(--color-neutral-solid-gray-50);
            border-left: 3px solid var(--color-primitive-blue-800);
            border-radius: 0 var(--border-radius-8) var(--border-radius-8) 0;
            padding: 1rem 1.25rem;
        }

        .recent-updates summary {
            cursor: pointer;
            font-weight: var(--font-weight-700);
            font-size: 1.05rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            list-style: none;
            user-select: none;
        }

        .recent-updates summary::-webkit-details-marker { display: none; }

        .recent-updates summary::before {
            content: '▼ ';
            font-size: 0.7rem;
            margin-right: 0.4rem;
            transition: transform 0.2s;
            display: inline-block;
        }

        .recent-updates:not([open]) summary::before {
            transform: rotate(-90deg);
        }

        .total-count {
            font-weight: var(--font-weight-400);
            font-size: var(--font-size-14);
            color: var(--color-neutral-solid-gray-536);
        }

        .update-group {
            margin-top: 0.75rem;
        }

        .update-group + .update-group {
            margin-top: 1rem;
        }

        .update-date-heading {
            font-size: var(--font-size-14);
            font-weight: var(--font-weight-700);
            color: var(--color-neutral-solid-gray-600);
            padding-bottom: 0.25rem;
            margin-bottom: 0.25rem;
            border-bottom: 1px solid var(--color-neutral-solid-gray-100);
        }

        .update-list {
            list-style: none;
            padding: 0;
        }

        .update-list li {
            font-size: var(--font-size-14);
            padding: 0.15rem 0;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .update-list li a {
            color: var(--color-primitive-blue-800);
            text-decoration: none;
            overflow-wrap: break-word;
            word-break: break-word;
            min-width: 0;
        }

        .update-list li a:hover {
            text-decoration: underline;
        }

        .update-list .update-author {
            color: var(--color-neutral-solid-gray-536);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .update-older-toggle {
            margin-top: 0.75rem;
        }

        .update-older-toggle summary {
            cursor: pointer;
            font-size: var(--font-size-14);
            color: var(--color-primitive-blue-800);
            list-style: none;
        }

        .update-older-toggle summary::-webkit-details-marker { display: none; }

        .update-older-toggle summary:hover {
            text-decoration: underline;
        }

        /* ── Controls ── */
        .controls {
            margin-bottom: 1.5rem;
        }

        .search-input {
            width: 100%;
            padding: 0.6rem 1rem;
            font-size: var(--font-size-16);
            font-family: var(--font-family-sans);
            border: 1px solid var(--color-neutral-solid-gray-100);
            border-radius: var(--border-radius-8);
            outline: none;
            transition: border-color 0.2s;
            margin-bottom: 0.75rem;
        }

        .search-input:focus {
            border-color: var(--color-primitive-blue-800);
        }

        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        .results-info {
            font-size: var(--font-size-14);
            color: var(--color-neutral-solid-gray-536);
        }

        .results-info .clear-btn {
            margin-left: 0.5rem;
            color: var(--color-primitive-blue-800);
            background: none;
            border: none;
            font-family: var(--font-family-sans);
            font-size: var(--font-size-14);
            cursor: pointer;
            text-decoration: underline;
        }

        .sort-select {
            padding: 0.35rem 0.6rem;
            font-size: var(--font-size-14);
            font-family: var(--font-family-sans);
            border: 1px solid var(--color-neutral-solid-gray-100);
            border-radius: var(--border-radius-8);
            background: var(--color-neutral-white);
            cursor: pointer;
            outline: none;
            flex-shrink: 0;
        }

        .sort-select:focus {
            border-color: var(--color-primitive-blue-800);
        }

        .controls-selects {
            display: flex;
            flex-direction: row;
            flex-wrap: wrap;
            gap: 0.75rem;
            align-items: center;
            justify-content: flex-end;
            flex-shrink: 0;
        }

        .category-filter-wrap,
        .sort-wrap {
            display: flex;
            align-items: center;
        }

        /* ── Reviews List ── */
        .reviews-list {
            display: flex;
            flex-direction: column;
        }

        .review-card {
            padding: 1rem;
            border-bottom: 1px solid var(--color-neutral-solid-gray-100);
            text-decoration: none;
            color: inherit;
            display: block;
            border-radius: var(--border-radius-8);
            transition: background 0.15s, box-shadow 0.2s;
            min-width: 0;
        }

        .review-card-thumb-wrap {
            margin: 0 0 0.65rem;
            width: 100%;
            max-height: 160px;
            border-radius: var(--border-radius-8);
            overflow: hidden;
            background: var(--color-neutral-solid-gray-50);
        }

        .review-card-thumb-wrap picture {
            display: block;
        }

        .review-card-thumb {
            display: block;
            width: 100%;
            height: 160px;
            object-fit: cover;
            object-position: center top;
        }

        .review-card:first-child {
            border-top: 1px solid var(--color-neutral-solid-gray-100);
        }

        .review-card:hover {
            background: var(--color-neutral-solid-gray-50);
            box-shadow: var(--elevation-1);
        }

        .review-card .review-title {
            font-size: 1.05rem;
            font-weight: var(--font-weight-700);
            color: var(--color-primitive-blue-800);
            margin-bottom: 0.2rem;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .review-card:hover .review-title {
            text-decoration: underline;
        }

        .review-card .review-author {
            font-size: var(--font-size-14);
            color: var(--color-neutral-solid-gray-600);
            margin-bottom: 0.4rem;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .review-card .review-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .lang-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.15rem 0.5rem;
            border-radius: var(--border-radius-full);
            background: var(--color-primitive-light-blue-50);
            color: var(--color-primitive-blue-800);
            border: 1px solid var(--color-primitive-light-blue-200);
            text-decoration: none;
            transition: background 0.15s;
        }

        .lang-badge:hover {
            background: var(--color-primitive-light-blue-200);
        }

        .category-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.2rem;
            font-size: 0.65rem;
            padding: 0.1rem 0.45rem;
            border-radius: var(--border-radius-full);
            background: var(--color-neutral-solid-gray-50);
            color: var(--color-neutral-solid-gray-600);
            border: 1px solid var(--color-neutral-solid-gray-100);
        }

        .category-badge .cat-sub {
            font-size: 0.55rem;
            opacity: 0.55;
        }

        .review-date {
            font-size: 0.75rem;
            color: var(--color-neutral-solid-gray-536);
            margin-left: auto;
        }

        .empty-state {
            text-align: center;
            color: var(--color-neutral-solid-gray-536);
            padding: 3rem 1rem;
        }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.25rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .pagination:empty { display: none; }

        .page-btn {
            min-width: 2.2rem;
            height: 2.2rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 0 0.5rem;
            font-size: var(--font-size-14);
            font-family: var(--font-family-sans);
            border: 1px solid var(--color-neutral-solid-gray-100);
            border-radius: var(--border-radius-8);
            background: var(--color-neutral-white);
            color: var(--color-neutral-solid-gray-900);
            cursor: pointer;
            transition: all 0.15s;
            text-decoration: none;
            user-select: none;
        }

        .page-btn:hover:not(:disabled):not(.active) {
            background: var(--color-neutral-solid-gray-50);
        }

        .page-btn.active {
            background: var(--color-primitive-blue-800);
            color: var(--color-neutral-white);
            border-color: var(--color-primitive-blue-800);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .page-ellipsis {
            min-width: 2rem;
            text-align: center;
            color: var(--color-neutral-solid-gray-536);
            font-size: var(--font-size-14);
            user-select: none;
        }

        /* ── Footer ── */
        footer {
            margin-top: auto;
            padding: 2rem 1rem;
            color: var(--color-neutral-solid-gray-536);
            font-size: 0.8rem;
            text-align: center;
        }

        footer a {
            color: var(--color-primitive-blue-800);
            text-decoration: none;
        }

        footer a:hover { text-decoration: underline; }

        .nav-link {
            display: inline-block;
            color: var(--color-primitive-blue-800);
            text-decoration: none;
            font-size: var(--font-size-14);
            padding: 0.75rem 1.5rem;
        }

        .nav-link:hover { text-decoration: underline; }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.4rem; }
            .container { padding: 1.5rem 1rem; }
            .controls-row { flex-direction: column; align-items: stretch; gap: 0.5rem; }
            .controls-selects {
                flex-direction: column;
                align-items: stretch;
                width: 100%;
            }
            .category-filter-wrap .sort-select,
            .sort-wrap .sort-select { width: 100%; }
            .update-list li { flex-direction: column; align-items: flex-start; gap: 0.1rem; }
            .daily-pick { flex-direction: column; }
            .daily-pick .daily-thumb { width: 100%; height: auto; aspect-ratio: 1/1; }
        }

        /* ── 今日の1冊 ── */
        .daily-pick {
            display: flex; gap: 1rem; align-items: center;
            border: 1px solid var(--color-primitive-light-blue-200);
            background: var(--color-primitive-light-blue-50);
            border-radius: var(--border-radius-12);
            padding: 1rem; margin-bottom: 1.5rem;
        }
        .daily-pick .daily-thumb {
            flex-shrink: 0; width: 96px; height: 96px; border-radius: var(--border-radius-8);
            object-fit: cover; background: var(--color-neutral-solid-gray-50);
        }
        .daily-pick .daily-body { min-width: 0; flex: 1 1 auto; }
        .daily-pick .daily-eyebrow {
            font-size: 0.7rem; font-weight: var(--font-weight-700);
            color: var(--color-primitive-blue-800); letter-spacing: 0.04em;
        }
        .daily-pick .daily-title { font-size: var(--font-size-20); font-weight: var(--font-weight-700); }
        .daily-pick .daily-title a { color: var(--color-neutral-solid-gray-900); text-decoration: none; }
        .daily-pick .daily-title a:hover { text-decoration: underline; }
        .daily-pick .daily-author { font-size: var(--font-size-14); color: var(--color-neutral-solid-gray-536); }
        .daily-pick .daily-reroll {
            margin-top: 0.4rem; font-size: var(--font-size-14); color: var(--color-primitive-blue-800);
            background: none; border: 1px solid var(--color-primitive-blue-800);
            border-radius: var(--border-radius-8); padding: 0.2rem 0.6rem; cursor: pointer;
        }
        .daily-pick .daily-reroll:hover { background: #fff; }
    </style>
</head>

        var PER_PAGE = 30;
        var RECENT_DATES_EXPANDED = 2;

        var state = {
            allReviews: [],
            filteredReviews: [],
            currentPage: 1,
            searchQuery: '',
            category: '',
            sort: 'newest'
        };

        var debounceTimer = null;

        function reviewHref(r) {
            return 'reviews/ja/' + encodeURIComponent(r.filename.replace('.md', '.html'));
        }

        // ── URL Parameters ──

        function readUrlParams() {
            var params = new URLSearchParams(window.location.search);
            state.searchQuery = params.get('q') || '';
            state.category = params.get('category') || '';
            state.sort = params.get('sort') || 'newest';
            state.currentPage = parseInt(params.get('page'), 10) || 1;

            document.getElementById('search-input').value = state.searchQuery;
            document.getElementById('sort-select').value = state.sort;
        }

        function updateUrlParams() {
            var params = new URLSearchParams();
            if (state.searchQuery) params.set('q', state.searchQuery);
            if (state.category) params.set('category', state.category);
            if (state.sort !== 'newest') params.set('sort', state.sort);
            if (state.currentPage > 1) params.set('page', String(state.currentPage));
            var qs = params.toString();
            var newUrl = qs ? '?' + qs : window.location.pathname;
            history.replaceState(null, '', newUrl);
        }

        // ── Review activity timestamps ──

        function reviewActivityAt(r) {
            return r.updated_at || r.created_at || r.date || '';
        }

        function reviewActivityDate(r) {
            var ts = reviewActivityAt(r);
            if (!ts) return 'unknown';
            return ts.substring(0, 10);
        }

        // ── Recent Updates ──

        function buildRecentUpdates(reviews) {
            var container = document.getElementById('recent-updates');
            var content = document.getElementById('recent-updates-content');
            var totalEl = document.getElementById('total-count');

            if (!reviews.length) return;

            totalEl.textContent = '全 ' + reviews.length + ' 冊';
            container.style.display = '';

            var groups = {};
            var dateOrder = [];
            reviews.forEach(function (r) {
                var d = reviewActivityDate(r);
                if (!groups[d]) {
                    groups[d] = [];
                    dateOrder.push(d);
                }
                groups[d].push(r);
            });

            dateOrder.sort(function (a, b) { return b.localeCompare(a); });

            var html = '';
            dateOrder.forEach(function (date, idx) {
                var books = groups[date];
                var label = formatDateLabel(date);
                var isOlder = idx >= RECENT_DATES_EXPANDED;

                if (isOlder && idx === RECENT_DATES_EXPANDED) {
                    html += '<details class="update-older-toggle"><summary>以前の更新を表示 (' + (dateOrder.length - RECENT_DATES_EXPANDED) + ' 日分)</summary>';
                }

                html += '<div class="update-group">';
                html += '<div class="update-date-heading">' + label + '（' + books.length + '冊）</div>';
                html += '<ul class="update-list">';
                books.forEach(function (r) {
                    html += '<li><a href="' + reviewHref(r) + '">' + escapeHtml(r.title) + '</a><span class="update-author"> - ' + escapeHtml(r.author) + '</span></li>';
                });
                html += '</ul></div>';
            });

            if (dateOrder.length > RECENT_DATES_EXPANDED) {
                html += '</details>';
            }

            content.innerHTML = html;
        }

        function formatDateLabel(dateStr) {
            if (!dateStr || dateStr === 'unknown') return '日付不明';
            var parts = dateStr.split('-');
            if (parts.length === 3) {
                return parseInt(parts[1], 10) + '/' + parseInt(parts[2], 10);
            }
            return dateStr;
        }

        // ── Category filter (select) ──

        function getCategoriesForFilter(review) {
            if (Array.isArray(review.categories) && review.categories.length) {
                return review.categories.filter(function (c) { return !!c; });
            }
            if (review.category) return [review.category];
            return ['未分類'];
        }

        function getCategoriesForDisplay(review) {
            if (Array.isArray(review.categories) && review.categories.length) {
                return review.categories.filter(function (c) { return !!c; });
            }
            if (review.category) return [review.category];
            return [];
        }

        function optionTitleForCategory(label) {
            var sub = CATEGORY_LABELS[label];
            if (!sub) return '';
            return sub.en + ' / ' + sub['zh-tw'];
        }

        function buildCategorySelect(reviews) {
            var wrap = document.getElementById('category-filter-wrap');
            var selectEl = document.getElementById('category-select');
            var counts = {};
            var hasCategory = false;

            reviews.forEach(function (r) {
                var categories = Array.from(new Set(getCategoriesForFilter(r)));
                if (categories.length && !(categories.length === 1 && categories[0] === '未分類')) {
                    hasCategory = true;
                }
                categories.forEach(function (cat) {
                    counts[cat] = (counts[cat] || 0) + 1;
                });
            });

            if (!hasCategory) {
                wrap.style.display = 'none';
                selectEl.innerHTML = '';
                return;
            }

            wrap.style.display = '';
            var cats = Object.keys(counts).sort(function (a, b) {
                if (a === '未分類') return 1;
                if (b === '未分類') return -1;
                return (counts[b] - counts[a]);
            });

            selectEl.innerHTML = '';

            var optAll = document.createElement('option');
            optAll.value = '';
            optAll.textContent = 'すべて (' + reviews.length + ')';
            var allTitle = optionTitleForCategory('すべて');
            if (allTitle) optAll.title = allTitle;
            selectEl.appendChild(optAll);

            cats.forEach(function (cat) {
                var opt = document.createElement('option');
                opt.value = cat;
                opt.textContent = cat + ' (' + counts[cat] + ')';
                var t = optionTitleForCategory(cat);
                if (t) opt.title = t;
                selectEl.appendChild(opt);
            });

            // URL の category が一覧に無いときは空に戻し、共有リンクの誤りで 0 件固定にならないようにする
            if (state.category) {
                var found = false;
                for (var i = 0; i < selectEl.options.length; i++) {
                    if (selectEl.options[i].value === state.category) {
                        found = true;
                        break;
                    }
                }
                if (!found) state.category = '';
            }

            syncCategorySelect();
        }

        function syncCategorySelect() {
            var selectEl = document.getElementById('category-select');
            if (!selectEl.options.length) return;
            selectEl.value = state.category || '';
            if (state.category && selectEl.value !== state.category) {
                state.category = '';
                selectEl.value = '';
            }
        }

        // ── Filters & Sort ──

        function applyFilters() {
            var reviews = state.allReviews.slice();

            if (state.searchQuery) {
                var q = state.searchQuery.toLowerCase();
                var qNorm = q.replace(/[・\s\u3000]/g, '');
                reviews = reviews.filter(function (r) {
                    var t = (r.title || '').toLowerCase();
                    var a = (r.author || '').toLowerCase();
                    return t.indexOf(q) !== -1 ||
                           a.indexOf(q) !== -1 ||
                           a.replace(/[・\s\u3000]/g, '').indexOf(qNorm) !== -1;
                });
            }

            if (state.category) {
                reviews = reviews.filter(function (r) {
                    return getCategoriesForFilter(r).indexOf(state.category) !== -1;
                });
            }

            sortReviews(reviews);
            state.filteredReviews = reviews;

            var totalPages = Math.ceil(reviews.length / PER_PAGE) || 1;
            if (state.currentPage > totalPages) state.currentPage = totalPages;
            if (state.currentPage < 1) state.currentPage = 1;

            renderReviews();
            renderPagination();
            renderResultsInfo();
            updateUrlParams();
        }

        function sortReviews(arr) {
            switch (state.sort) {
                case 'newest':
                    arr.sort(function (a, b) {
                        return reviewActivityAt(b).localeCompare(reviewActivityAt(a));
                    });
                    break;
                case 'oldest':
                    arr.sort(function (a, b) {
                        return reviewActivityAt(a).localeCompare(reviewActivityAt(b));
                    });
                    break;
                case 'title':
                    arr.sort(function (a, b) {
                        return (a.title || '').localeCompare(b.title || '', 'ja');
                    });
                    break;
                case 'author':
                    arr.sort(function (a, b) {
                        return (a.author || '').localeCompare(b.author || '', 'ja');
                    });
                    break;
            }
        }

        // ── Rendering ──

        function renderReviews() {
            var list = document.getElementById('reviews-list');
            var start = (state.currentPage - 1) * PER_PAGE;
            var end = start + PER_PAGE;
            var pageReviews = state.filteredReviews.slice(start, end);

            if (pageReviews.length === 0) {
                list.innerHTML = '<div class="empty-state">該当する書評がありません</div>';
                return;
            }

            list.innerHTML = '';
            pageReviews.forEach(function (r) {
                var card = document.createElement('a');
                card.className = 'review-card';
                card.href = reviewHref(r);

                var title = document.createElement('div');
                title.className = 'review-title';
                title.textContent = r.title;

                var author = document.createElement('div');
                author.className = 'review-author';
                author.textContent = r.author;

                var meta = document.createElement('div');
                meta.className = 'review-meta';

                (r.languages || ['ja']).forEach(function (lang) {
                    var badge = document.createElement('a');
                    badge.className = 'lang-badge';
                    badge.textContent = LANG_LABELS[lang] || lang;
                    badge.href = 'reviews/' + lang + '/' + encodeURIComponent(r.filename.replace('.md', '.html'));
                    badge.addEventListener('click', function (e) { e.stopPropagation(); });
                    meta.appendChild(badge);
                });

                var displayCategories = getCategoriesForDisplay(r);
                var categoryLimit = 3;
                displayCategories.slice(0, categoryLimit).forEach(function (cat) {
                    var catBadge = document.createElement('span');
                    catBadge.className = 'category-badge';
                    var catSub = CATEGORY_LABELS[cat];
                    var catHtml = escapeHtml(cat);
                    if (catSub) {
                        catHtml += ' <span class="cat-sub">' + escapeHtml(catSub.en) + '</span>';
                        catHtml += ' <span class="cat-sub">' + escapeHtml(catSub['zh-tw']) + '</span>';
                    }
                    catBadge.innerHTML = catHtml;
                    meta.appendChild(catBadge);
                });
                if (displayCategories.length > categoryLimit) {
                    var moreBadge = document.createElement('span');
                    moreBadge.className = 'category-badge';
                    moreBadge.textContent = '+' + (displayCategories.length - categoryLimit);
                    meta.appendChild(moreBadge);
                }

                // 公開も更新も同様に扱う: カードの日付は活動日（更新があれば更新日、
                // なければ公開日）を表示。並び順・最近の更新（reviewActivityAt）と一貫させる。
                var activityDate = reviewActivityDate(r);
                if (activityDate && activityDate !== 'unknown') {
                    var dateEl = document.createElement('span');
                    dateEl.className = 'review-date';
                    dateEl.textContent = activityDate;
                    var pubDate = r.date || (r.created_at ? String(r.created_at).substring(0, 10) : '');
                    if (pubDate && pubDate !== activityDate) {
                        dateEl.title = '公開日 ' + pubDate + ' / 更新日 ' + activityDate;
                    }
                    meta.appendChild(dateEl);
                }

                if (r.image) {
                    var thumbWrap = document.createElement('div');
                    thumbWrap.className = 'review-card-thumb-wrap';
                    var pic = document.createElement('picture');
                    var srcWebp = String(r.image).replace(/\.png$/i, '.webp');
                    var srcPng = r.image;
                    var source = document.createElement('source');
                    source.type = 'image/webp';
                    source.srcset = srcWebp;
                    var timg = document.createElement('img');
                    timg.src = srcPng;
                    timg.alt = '';
                    timg.loading = 'lazy';
                    timg.decoding = 'async';
                    timg.className = 'review-card-thumb';
                    pic.appendChild(source);
                    pic.appendChild(timg);
                    thumbWrap.appendChild(pic);
                    card.appendChild(thumbWrap);
                }

                card.appendChild(title);
                card.appendChild(author);
                card.appendChild(meta);
                list.appendChild(card);
            });
        }

        function renderResultsInfo() {
            var el = document.getElementById('results-info');
            var total = state.allReviews.length;
            var filtered = state.filteredReviews.length;
            var isFiltered = state.searchQuery || state.category;

            var html = '';
            if (isFiltered) {
                html = filtered + ' 件 / ' + total + ' 件';
                html += '<button class="clear-btn" id="clear-filters">クリア</button>';
            } else {
                html = '全 ' + total + ' 件';
            }
            el.innerHTML = html;

            var clearBtn = document.getElementById('clear-filters');
            if (clearBtn) {
                clearBtn.addEventListener('click', function () {
                    state.searchQuery = '';
                    state.category = '';
                    state.currentPage = 1;
                    document.getElementById('search-input').value = '';
                    syncCategorySelect();
                    applyFilters();
                });
            }
        }

        // ── Pagination ──

        function renderPagination() {
            var container = document.getElementById('pagination');
            var total = state.filteredReviews.length;
            var totalPages = Math.ceil(total / PER_PAGE) || 1;

            if (totalPages <= 1) {
                container.innerHTML = '';
                return;
            }

            container.innerHTML = '';

            var prevBtn = document.createElement('button');
            prevBtn.className = 'page-btn';
            prevBtn.textContent = '前へ';
            prevBtn.disabled = state.currentPage <= 1;
            prevBtn.addEventListener('click', function () { goToPage(state.currentPage - 1); });
            container.appendChild(prevBtn);

            var pages = buildPageNumbers(state.currentPage, totalPages);
            pages.forEach(function (p) {
                if (p === '...') {
                    var ellipsis = document.createElement('span');
                    ellipsis.className = 'page-ellipsis';
                    ellipsis.textContent = '...';
                    container.appendChild(ellipsis);
                } else {
                    var btn = document.createElement('button');
                    btn.className = 'page-btn' + (p === state.currentPage ? ' active' : '');
                    btn.textContent = p;
                    btn.addEventListener('click', function () { goToPage(p); });
                    container.appendChild(btn);
                }
            });

            var nextBtn = document.createElement('button');
            nextBtn.className = 'page-btn';
            nextBtn.textContent = '次へ';
            nextBtn.disabled = state.currentPage >= totalPages;
            nextBtn.addEventListener('click', function () { goToPage(state.currentPage + 1); });
            container.appendChild(nextBtn);
        }

        function buildPageNumbers(current, total) {
            if (total <= 7) {
                var arr = [];
                for (var i = 1; i <= total; i++) arr.push(i);
                return arr;
            }
            var pages = [1];
            var start = Math.max(2, current - 1);
            var end = Math.min(total - 1, current + 1);
            if (start > 2) pages.push('...');
            for (var j = start; j <= end; j++) pages.push(j);
            if (end < total - 1) pages.push('...');
            pages.push(total);
            return pages;
        }

        function goToPage(page) {
            state.currentPage = page;
            applyFilters();
            window.scrollTo({ top: document.getElementById('controls').offsetTop - 20, behavior: 'smooth' });
        }

        // ── Utilities ──

        function escapeHtml(str) {
            var div = document.createElement('div');
            div.appendChild(document.createTextNode(str || ''));
            return div.innerHTML;
        }

        // ── Event Handlers ──

        document.getElementById('search-input').addEventListener('input', function (e) {
            var val = e.target.value;
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(function () {
                state.searchQuery = val;
                state.currentPage = 1;
                applyFilters();
            }, 200);
        });

        document.getElementById('sort-select').addEventListener('change', function (e) {
            state.sort = e.target.value;
            state.currentPage = 1;
            applyFilters();
        });

        document.getElementById('category-select').addEventListener('change', function (e) {
            state.category = e.target.value;
            state.currentPage = 1;
            applyFilters();
        });

        // ── Init ──

        var reviewsManifestVer = document.documentElement.getAttribute('data-reviews-manifest') || '1';
        fetch('reviews.json?v=' + encodeURIComponent(reviewsManifestVer), { cache: 'no-cache' })
            .then(function (res) { return res.json(); })
            .then(function (reviews) {
                if (!reviews || !reviews.length) {
                    document.getElementById('reviews-list').innerHTML = '<div class="empty-state">まだ書評がありません</div>';
                    return;
                }

                reviews.sort(function (a, b) {
                    return reviewActivityAt(b).localeCompare(reviewActivityAt(a));
                });

                state.allReviews = reviews;

                readUrlParams();
                buildRecentUpdates(reviews);
                buildCategorySelect(reviews);
                document.getElementById('controls').style.display = '';
                applyFilters();
            })
            .catch(function () {
                document.getElementById('reviews-list').innerHTML = '<div class="empty-state">まだ書評がありません</div>';
            });
    })();

            reroll.type = 'button';
            reroll.className = 'daily-reroll';
            reroll.textContent = '別の1冊（ランダム）';
            reroll.addEventListener('click', function () {
                var r = reviews[Math.floor(Math.random() * reviews.length)];
                render(reviews, r);
            });

            body.appendChild(eyebrow);
            body.appendChild(title);
            body.appendChild(author);
            body.appendChild(reroll);
            box.appendChild(body);
        }

        C.fetchReviews().then(function (reviews) {
            if (!reviews || !reviews.length) return;
            var withImg = reviews.filter(function (r) { return r.image; });
            var pool = withImg.length ? withImg : reviews;
            var today = new Date().toISOString().substring(0, 10);
            var pick = pool[hashDate(today) % pool.length];
            render(pool, pick);
        }).catch(function () { /* ウィジェットは非表示のまま */ });
    })();
    </script>
</body>
</html>
