<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Portfolio | shioki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans JP', Helvetica, Arial, sans-serif;
            background: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #24292f;
            line-height: 1.6;
        }

        .container {
            padding: 2rem 1.5rem;
            max-width: 800px;
            width: 100%;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid #d0d7de;
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 0.3rem;
            color: #24292f;
        }

        /* Reviews Section */
        .reviews-list {
            display: flex;
            flex-direction: column;
        }

        .review-card {
            padding: 1rem 0;
            border-bottom: 1px solid #d0d7de;
            text-decoration: none;
            color: inherit;
            display: block;
            transition: background 0.15s;
        }

        .review-card:first-child {
            border-top: 1px solid #d0d7de;
        }

        .review-card:hover {
            background: #f6f8fa;
        }

        .review-card .review-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #0969da;
            margin-bottom: 0.2rem;
        }

        .review-card:hover .review-title {
            text-decoration: underline;
        }

        .review-card .review-author {
            font-size: 0.85rem;
            color: #656d76;
            margin-bottom: 0.4rem;
        }

        .review-card .review-meta {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .lang-badge {
            display: inline-block;
            font-size: 0.7rem;
            padding: 0.1rem 0.45rem;
            border-radius: 12px;
            background: #ddf4ff;
            color: #0969da;
            border: 1px solid #b6e3ff;
            text-decoration: none;
            transition: background 0.15s;
        }

        .lang-badge:hover {
            background: #b6e3ff;
        }

        .review-date {
            font-size: 0.75rem;
            color: #8b949e;
            margin-left: auto;
        }

        .empty-state {
            text-align: center;
            color: #8b949e;
            padding: 3rem 1rem;
        }

        footer {
            margin-top: auto;
            padding: 2rem 1rem;
            color: #8b949e;
            font-size: 0.8rem;
            text-align: center;
        }

        footer a {
            color: #0969da;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 1.4rem; }
            .container { padding: 1.5rem 1rem; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Books Portfolio</h1>
        </div>

        <div id="reviews-list" class="reviews-list">
            <div class="empty-state">Loading...</div>
        </div>
    </div>

    <footer>
        <p>&copy; <span id="current-year"></span> <a href="https://github.com/shioki" target="_blank">shioki</a> &middot; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license">CC BY-NC-SA 4.0</a></p>
    </footer>

    <script>
        document.getElementById('current-year').textContent = new Date().getFullYear();

        var LANG_LABELS = { ja: '日本語', en: 'English', 'zh-tw': '繁體中文' };

        fetch('reviews.json')
            .then(function (res) { return res.json(); })
            .then(function (reviews) {
                var list = document.getElementById('reviews-list');

                if (reviews.length === 0) {
                    list.innerHTML = '<div class="empty-state">No reviews yet.</div>';
                    return;
                }

                reviews.sort(function (a, b) {
                    return (b.date || '').localeCompare(a.date || '');
                });

                list.innerHTML = '';
                reviews.forEach(function (r) {
                    var card = document.createElement('a');
                    card.className = 'review-card';
                    card.href = 'reviews/ja/' + encodeURIComponent(r.filename.replace('.md', '.html'));

                    var title = document.createElement('div');
                    title.className = 'review-title';
                    title.textContent = r.title;

                    var author = document.createElement('div');
                    author.className = 'review-author';
                    author.textContent = r.author;

                    var meta = document.createElement('div');
                    meta.className = 'review-meta';

                    (r.languages || ['ja']).forEach(function (lang) {
                        var badge = document.createElement('a');
                        badge.className = 'lang-badge';
                        badge.textContent = LANG_LABELS[lang] || lang;
                        badge.href = 'reviews/' + lang + '/' + encodeURIComponent(r.filename.replace('.md', '.html'));
                        badge.addEventListener('click', function (e) { e.stopPropagation(); });
                        meta.appendChild(badge);
                    });

                    if (r.date) {
                        var date = document.createElement('span');
                        date.className = 'review-date';
                        date.textContent = r.date;
                        meta.appendChild(date);
                    }

                    card.appendChild(title);
                    card.appendChild(author);
                    card.appendChild(meta);
                    list.appendChild(card);
                });
            })
            .catch(function () {
                var list = document.getElementById('reviews-list');
                list.innerHTML = '<div class="empty-state">No reviews yet.</div>';
            });
    </script>
</body>
</html>
