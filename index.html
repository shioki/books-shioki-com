<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books Portfolio | shioki</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #e8e8e8;
        }
        
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        
        .logo {
            font-size: 5rem;
            margin-bottom: 1rem;
            animation: float 3s ease-in-out infinite;
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(90deg, #e94560, #f39c12);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .tagline {
            font-size: 1.2rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }
        
        .status {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .status h2 {
            color: #e94560;
            margin-bottom: 1rem;
            font-size: 1.5rem;
        }
        
        .status p {
            line-height: 1.8;
        }
        
        .stats {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }
        
        .stat-item {
            background: rgba(233, 69, 96, 0.2);
            padding: 1.5rem 2rem;
            border-radius: 12px;
            border: 1px solid rgba(233, 69, 96, 0.3);
        }
        
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e94560;
        }
        
        .stat-label {
            font-size: 0.9rem;
            color: #a0a0a0;
        }
        
        footer {
            margin-top: 3rem;
            color: #606060;
            font-size: 0.9rem;
        }
        
        footer a {
            color: #e94560;
            text-decoration: none;
        }
        
        footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">📚</div>
        <h1>Books Portfolio</h1>
        <p class="tagline">Kindle × AI による書評・4コマ漫画</p>
        
        <div class="status">
            <h2>🚧 準備中</h2>
            <p>
                現在、コンテンツを準備しています。<br>
                Difyを活用したAI自動生成ワークフローを構築中です。<br>
                近日公開予定！
            </p>
        </div>
        
        <div class="stats">
            <div class="stat-item">
                <div class="stat-number">400+</div>
                <div class="stat-label">年間読書目標</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">AI</div>
                <div class="stat-label">自動生成</div>
            </div>
            <div class="stat-item">
                <div class="stat-number">4コマ</div>
                <div class="stat-label">ビジュアル化</div>
            </div>
        </div>
    </div>
    
    <footer>
        <p>© 2025 <a href="https://github.com/shioki" target="_blank">shioki</a></p>
    </footer>
</body>
</html>
