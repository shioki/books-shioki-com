            '村上 春樹': '村上春樹',
            '伊藤 羊一': '伊藤羊一',
            'ブレイディみかこ': 'ブレイディ みかこ'
        };

        var NON_AUTHORS = {
            '広野和美': true, '山形浩生': true, '村井章子': true,
            '岡本 麻左子': true, '柴田元幸': true, '柴田裕之': true,
            '上原裕美子': true, '鬼澤 忍': true, '会田弘継': true,
            '山岡由美': true, '関美和': true, '秋山 勝': true,
            '橋川 史': true, '飯嶋 貴子': true, '立木勝': true,
            '屋代通子': true, '小坂 恵理': true, '桐谷知未': true,
            '長尾 高弘': true, '榊原 彰': true, '小野木明恵': true,
            '濱野 大道': true, '依田光江': true, '千葉 敏生': true,
            '松丸 さとみ': true, '雨宮 寛': true, '今井 章子': true,
            '山田美明': true, '山田文': true, '三宅康雄': true,
            '長尾莉紗': true, '高取芳彦': true, '藤田美菜子': true,
            '柴田さとみ': true, '関根光宏': true, '芝瑞紀': true,
            '島崎由里子': true, '倉嶋雅人': true, '鈴木力衛': true,
            '宇佐川 晶子': true, '山田陽子': true, '高里ひろ': true,
            '大野 和基': true, '大野 一': true, '福井憲彦': true,
            '文豪e叢書編集部': true, '栗原聡': true
        };

        var PER_BOOK_EXCLUDE = {
            'テクノ封建制': { '斎藤幸平': true },
            '日本経済AI成長戦略': { '松尾 豊': true, '松尾\u3000豊': true },
            'ハードウェアハッカー': { '高須正和': true },
            '欲望の資本主義': { 'ＮＨＫ「欲望の資本主義」制作班': true }
        };

        var TRANSLATOR_ONLY_FOR = {
            '村上春樹': { 'ティム・オブライエン': true }
        };

        function normalizeName(name) {
            var n = name.trim().replace(/\u3000/g, ' ');
            return AUTHOR_NORMALIZE[n] || n;
        }

        function splitAuthors(raw) {
            return raw.split(/,\s+and\s+|\s+and\s+|,\s+|、/);
        }

        var PRIMARY_ROLES = { '著': true, '原著': true, '原作': true, '原案': true };

        function isNonAuthorByRoles(rawName, authorRoles) {
            if (!authorRoles) return null;
            var role = authorRoles[rawName];
            if (!role) return null;
            return !PRIMARY_ROLES[role];
        }

        function isNonAuthor(normName, rawName, title, allNormNames, authorRoles) {
            var roleResult = isNonAuthorByRoles(rawName, authorRoles);
            if (roleResult !== null) return roleResult;
            if (NON_AUTHORS[normName]) return true;
            for (var keyword in PER_BOOK_EXCLUDE) {
                if (title.indexOf(keyword) !== -1 && PER_BOOK_EXCLUDE[keyword][normName]) {
                    return true;
                }
            }
            if (TRANSLATOR_ONLY_FOR[normName]) {
                var checkSet = TRANSLATOR_ONLY_FOR[normName];
                for (var i = 0; i < allNormNames.length; i++) {
                    if (checkSet[allNormNames[i]]) return true;
                }
            }
            return false;
        }

        function authorSearchTerm(normName) {
            if (normName.indexOf('・') !== -1) {
                var parts = normName.split('・');
                return parts[parts.length - 1];
            }
            return normName;
        }

        function escapeHtml(s) {
            var d = document.createElement('div');
            d.appendChild(document.createTextNode(s));
            return d.innerHTML;
        }

        function getCategories(review) {
            if (Array.isArray(review.categories) && review.categories.length) {
                return review.categories.filter(function (c) { return !!c && c !== 'Kindle本'; });
            }
            var c = (review.category || '').trim();
            return (c && c !== 'Kindle本') ? [c] : [];
        }

        function buildAuthorData(reviews) {
            var counts = {};     // normName → count
            var books = {};      // normName → [{title, filename, languages, categories}]
            var genreSets = {};  // normName → {cat: true}

            reviews.forEach(function (r) {
                var raw = (r.author || '').trim();
                var title = (r.title || '').trim();
                if (!raw) return;

                var parts = splitAuthors(raw);
                var normNames = parts.map(normalizeName);
                var seen = {};
                var cats = getCategories(r);
                var authorRoles = r.author_roles || null;

                normNames.forEach(function (norm, idx) {
                    var rawName = parts[idx] ? parts[idx].trim().replace(/\u3000/g, ' ') : norm;
                    if (seen[norm] || isNonAuthor(norm, rawName, title, normNames, authorRoles)) return;
                    seen[norm] = true;
                    counts[norm] = (counts[norm] || 0) + 1;
                    if (!books[norm]) books[norm] = [];
                    books[norm].push({
                        title: title,
                        filename: r.filename || '',
                        languages: r.languages || ['ja']
                    });
                    if (!genreSets[norm]) genreSets[norm] = {};
                    cats.forEach(function (c) { genreSets[norm][c] = true; });
                });
            });

            var entries = [];
            for (var name in counts) {
                entries.push({
                    name: name,
                    count: counts[name],
                    books: books[name],
                    genres: Object.keys(genreSets[name])
                });
            }

            entries.sort(function (a, b) {
                if (b.count !== a.count) return b.count - a.count;
                return a.name.localeCompare(b.name, 'ja');
            });

            // 同数同順位（人数分繰り下げ）
            var rank = 1;
            for (var i = 0; i < entries.length; i++) {
                if (i > 0 && entries[i].count < entries[i - 1].count) {
                    rank = i + 1;
                }
                entries[i].rank = rank;
            }

            return entries;
        }

        function renderAuthors(entries, totalReviews) {
            var MAX_RANK = 5;
            var top = entries.filter(function (e) { return e.rank <= MAX_RANK; });

            document.getElementById('summary').textContent =
                '書評 ' + totalReviews + ' 冊から、よく読んでいる著者の上位5位を表示しています。';

            var container = document.getElementById('authors-list');
            container.innerHTML = '';

            if (top.length === 0) {
                container.innerHTML = '<p>該当する著者がいません。</p>';
                return;
            }

            top.forEach(function (entry) {
                var card = document.createElement('div');
                card.className = 'author-card';

                // header: name + count
                var header = document.createElement('div');
                header.className = 'author-card-header';

                var nameBlock = document.createElement('div');
                nameBlock.className = 'author-name-block';

                var nameJa = document.createElement('div');
                nameJa.className = 'author-name-ja';
                nameJa.textContent = entry.name;
                nameBlock.appendChild(nameJa);

                var labels = AUTHOR_LABELS[entry.name];
                if (labels) {
                    var nameSub = document.createElement('div');
                    nameSub.className = 'author-name-sub';
                    var parts = [];
                    if (labels.en) parts.push(labels.en);
                    if (labels['zh-tw']) parts.push(labels['zh-tw']);
                    nameSub.textContent = parts.join(' / ');
                    nameBlock.appendChild(nameSub);
                }

                header.appendChild(nameBlock);

                var countBadge = document.createElement('span');
                countBadge.className = 'author-count';
                countBadge.textContent = entry.count + '冊';
                header.appendChild(countBadge);

                card.appendChild(header);

                // rank
                var rankDiv = document.createElement('div');
                rankDiv.className = 'author-rank';
                rankDiv.textContent = entry.rank + '位';
                card.appendChild(rankDiv);

                // genre badges
                if (entry.genres.length > 0) {
                    var genresDiv = document.createElement('div');
                    genresDiv.className = 'author-genres';
                    entry.genres.forEach(function (cat) {
                        var badge = document.createElement('span');
                        badge.className = 'category-badge';
                        var catSub = CATEGORY_LABELS[cat];
                        var html = escapeHtml(cat);
                        if (catSub) {
                            var subParts = [];
                            if (catSub.en) subParts.push(catSub.en);
                            if (catSub['zh-tw']) subParts.push(catSub['zh-tw']);
                            if (subParts.length) {
                                html += ' <span class="cat-sub">' + escapeHtml(subParts.join(' / ')) + '</span>';
                            }
                        }
                        badge.innerHTML = html;
                        genresDiv.appendChild(badge);
                    });
                    card.appendChild(genresDiv);
                }

                // book list
                var bookList = document.createElement('ul');
                bookList.className = 'author-books';
                entry.books.forEach(function (book) {
                    var li = document.createElement('li');

                    var mainLink = document.createElement('a');
                    mainLink.href = 'reviews/ja/' + encodeURIComponent(book.filename.replace('.md', '.html'));
                    mainLink.textContent = book.title;
                    li.appendChild(mainLink);

                    if (book.languages.length > 1) {
                        var langsSpan = document.createElement('span');
                        langsSpan.className = 'book-langs';
                        var langLinks = [];
                        book.languages.forEach(function (lang) {
                            if (lang === 'ja') return;
                            langLinks.push(
                                '<a href="reviews/' + lang + '/' +
                                encodeURIComponent(book.filename.replace('.md', '.html')) +
                                '">' + escapeHtml(LANG_LABELS[lang] || lang) + '</a>'
                            );
                        });
                        if (langLinks.length) {
                            langsSpan.innerHTML = '(' + langLinks.join(' / ') + ')';
                            li.appendChild(langsSpan);
                        }
                    }

                    bookList.appendChild(li);
                });
                card.appendChild(bookList);

                // filter link
                var filterLink = document.createElement('a');
                filterLink.className = 'author-filter-link';
                filterLink.href = '/?q=' + encodeURIComponent(authorSearchTerm(entry.name));
                filterLink.textContent = 'この著者の書評を見る →';
                card.appendChild(filterLink);

                container.appendChild(card);
            });
        }

        fetch('reviews.json', { cache: 'no-cache' })
            .then(function (res) { return res.json(); })
            .then(function (reviews) {
                var entries = buildAuthorData(reviews);
                renderAuthors(entries, reviews.length);
            })
            .catch(function () {
                document.getElementById('authors-list').innerHTML =
                    '<p>データの読み込みに失敗しました。</p>';
            });
    })();
    </script>
</body>
</html>
