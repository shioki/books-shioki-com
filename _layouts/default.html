<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Books Portfolio | shioki</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ '/assets/css/dads.css' | relative_url }}">
</head>
<body class="markdown-page">
  <nav class="site-nav">
    <a href="{{ '/' | relative_url }}" class="nav-link">トップページ</a>
    <a href="{{ '/okiwa-profile.html' | relative_url }}" class="nav-link">キャラクター紹介</a>
  </nav>

  <main class="page-container">
    <article class="content-card">
      {{ content }}
    </article>
  </main>

  <footer class="site-footer">
    <p>&copy; <span id="current-year"></span> <a href="https://github.com/shioki" target="_blank" rel="noopener noreferrer">shioki</a> &middot; <a href="https://creativecommons.org/licenses/by-nc-sa/4.0/" target="_blank" rel="license noopener noreferrer">CC BY-NC-SA 4.0</a></p>
  </footer>

  <script>
    var y = document.getElementById('current-year');
    if (y) y.textContent = new Date().getFullYear();
  </script>
</body>
</html>
